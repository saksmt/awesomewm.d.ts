name: release
permissions:
  id-token: write
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: typing / install deps
        run: npm ci
        working-directory: typing
      - name: typing / typecheck
        run: npm run typecheck
        working-directory: typing
      - name: typing / lint
        run: npm run lint
        working-directory: typing
      - name: typing / check style
        run: npm run format-check
        working-directory: typing

      - name: example / install deps
        run: npm ci
        working-directory: example
      - name: example / lint
        run: npm run lint
        working-directory: example
      - name: example / check style
        run: npm run format-check
        working-directory: example
      - name: example / build
        run: npm run build
        working-directory: example

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: copy readme and license from repo root to package root
        run: cp *.md LICENSE typing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
        working-directory: typing
      - run: npm publish
        working-directory: typing
